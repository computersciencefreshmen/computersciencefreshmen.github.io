<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a1512" />
    <title>404 — Hanyu Yang</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #fffdf7;
        background:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
          #0a1512;
        background-size: 44px 44px;
        font-family: "Segoe UI", sans-serif;
      }
      main {
        width: min(860px, 100%);
        border-top: 1px solid rgba(255,255,255,.2);
        border-bottom: 1px solid rgba(255,255,255,.2);
        padding: clamp(50px, 10vw, 100px) 0;
      }
      .code {
        margin: 0 0 18px;
        color: #b5ff7d;
        font-family: Consolas, monospace;
        font-size: 12px;
        letter-spacing: .16em;
      }
      h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(62px, 12vw, 140px);
        font-weight: 400;
        line-height: .85;
        letter-spacing: -.065em;
      }
      h1 em { color: #b5ff7d; }
      p {
        max-width: 560px;
        margin: 32px 0;
        color: #adbbb5;
        font-size: 17px;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        padding: 15px 20px;
        color: #0a1512;
        background: #b5ff7d;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">ERROR / 404 · FIELD NOTE NOT FOUND</p>
      <h1>Wrong turn,<br /><em>good curiosity.</em></h1>
      <p>
        This page does not exist, but the useful work is one step away.
        这个页面不存在，但你可以返回主页继续探索。
      </p>
      <a href="/">Return to the portfolio →</a>
    </main>
  </body>
</html>
