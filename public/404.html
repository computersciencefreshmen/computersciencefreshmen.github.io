<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>404 — Hanyu Yang</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #262a28;
        background:
          linear-gradient(90deg, #f5f4f0 0 76%, #e4e1e8 76% 100%);
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        width: min(900px, 100%);
        padding: clamp(54px, 9vw, 96px) 0;
        border-top: 1px solid rgba(38, 42, 40, .18);
        border-bottom: 1px solid rgba(38, 42, 40, .18);
      }
      .mark {
        width: 48px;
        height: 48px;
        margin-bottom: 48px;
      }
      .code {
        margin: 0 0 22px;
        color: #3f5048;
        font-family: Consolas, monospace;
        font-size: 12px;
        letter-spacing: .14em;
      }
      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(58px, 10vw, 120px);
        font-weight: 550;
        line-height: .94;
        letter-spacing: -.065em;
      }
      h1 em {
        color: #262a28;
        font-style: normal;
        padding: 0 .08em .04em;
        background: #e4e1e8;
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      p {
        max-width: 570px;
        margin: 30px 0;
        color: #59615c;
        font-size: 17px;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 50px;
        padding: 0 20px;
        color: #fff;
        background: #262a28;
        border: 1px solid #262a28;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #3f5048;
        border-color: #3f5048;
      }
      a:focus-visible {
        outline: 3px solid #3f5048;
        outline-offset: 4px;
      }
      @media (max-width: 640px) {
        body {
          padding: 22px;
          background: #f5f4f0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/hy-mark-v2.svg" alt="" aria-hidden="true" />
      <p class="code">ERROR / 404 · PAGE NOT FOUND</p>
      <h1>Wrong turn,<br /><em>good curiosity.</em></h1>
      <p>
        This page does not exist, but the useful work is one step away.
        这个页面不存在，但你可以返回主页继续探索。
      </p>
      <a href="/">Return to the portfolio →</a>
    </main>
  </body>
</html>
